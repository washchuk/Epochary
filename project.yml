name: Epochary
options:
  bundleIdPrefix: com.washchuk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  EpocharyKit:
    path: Packages/EpocharyKit
targets:
  Epochary:
    type: application
    platform: macOS
    sources:
      - Epochary
    dependencies:
      - package: EpocharyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.washchuk.Epochary
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Epochary
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle command-line tools
        basedOnDependencyAnalysis: false
        script: |
          # Copies the tools built by Vendor/build-tools.sh into the app and signs them
          # with the app's identity and the hardened runtime, as notarization requires.
          set -euo pipefail
          VENDOR="$SRCROOT/build/vendor"
          HELPERS="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          LICENSES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
          if [ ! -d "$VENDOR/bin" ]; then
            if [ "$CONFIGURATION" = Release ]; then
              echo "error: Run Vendor/build-tools.sh first; a release must bundle the tools and their licenses."
              exit 1
            fi
            echo "warning: Tools aren't bundled (run Vendor/build-tools.sh); this build uses tools installed on the Mac."
            rm -rf "$HELPERS" "$LICENSES"
            exit 0
          fi
          mkdir -p "$HELPERS" "$LICENSES"
          rsync -a --delete "$VENDOR/bin/" "$HELPERS/"
          rsync -a --delete "$VENDOR/Licenses/" "$LICENSES/"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$IDENTITY" = "-" ]; then TIMESTAMP=--timestamp=none; else TIMESTAMP=--timestamp; fi
          for tool in "$HELPERS"/*; do
            codesign --force --options runtime "$TIMESTAMP" --sign "$IDENTITY" "$tool"
          done
